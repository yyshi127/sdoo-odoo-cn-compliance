name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-addon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Odoo addon
        run: python tools/validate_addon.py
      - name: Test XBRL archive contract
        run: python tools/test_xbrl_contract.py
      - name: Test XBRL normalization contract
        run: python tools/test_xbrl_normalizer.py
      - name: Test XBRL taxonomy compatibility contract
        run: python tools/test_xbrl_worker_compatibility.py
